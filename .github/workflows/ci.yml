name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-guard-self-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run security guard self-tests
        run: bash scripts/test-security-guards.sh

  verification:
    needs: security-guard-self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHROME_BIN: /usr/bin/google-chrome

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify immutable supply-chain references
        run: bash scripts/verify-supply-chain-inputs.sh

      - name: Verify production runtime policy
        run: bash scripts/verify-runtime-policy.sh

      - name: Verify security observability policy
        run: bash scripts/verify-security-observability-policy.sh

      - name: Verify security audit documentation
        run: bash scripts/verify-security-documentation.sh

      - name: Verify production image release policy
        run: bash scripts/verify-image-release-policy.sh

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify API contracts
        run: ./gradlew --no-daemon :core:api-contract:allTests

      - name: Run server tests including PostgreSQL Testcontainers
        run: ./gradlew --no-daemon :server:test

      - name: Build server distribution
        run: ./gradlew --no-daemon :server:build -x test

      - name: Run Android lint
        run: ./gradlew --no-daemon :app:androidApp:lintDebug

  sast:
    needs: security-guard-self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify immutable supply-chain references
        run: bash scripts/verify-supply-chain-inputs.sh

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Initialize CodeQL for Java and Kotlin
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build server classes for CodeQL
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks :server:clean :server:classes

      - name: Analyze Java and Kotlin
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

  dependency-review:
    if: github.event_name == 'pull_request'
    needs: security-guard-self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  supply-chain:
    needs: security-guard-self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify immutable supply-chain references
        run: bash scripts/verify-supply-chain-inputs.sh

      - name: Scan checkout for committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          exit-code: "1"
          timeout: 10m0s

      - name: Scan repository security configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: CRITICAL,HIGH
          format: table
          exit-code: "1"
          timeout: 10m0s

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build server runtime distribution
        run: ./gradlew --no-daemon :server:installDist

      - name: Verify Firebase Storage runtime graph is absent
        run: ./gradlew --no-daemon :server:verifyFirebaseStorageRuntimeGraph

      - name: Build pinned server image
        run: docker build --pull --tag jaiqal-server:${{ github.sha }} --file server/Dockerfile .

      - name: Generate CycloneDX SBOM from final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: jaiqal-server:${{ github.sha }}
          scanners: vuln
          format: cyclonedx
          output: server-sbom.cdx.json
          exit-code: "0"

      - name: Upload server SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-sbom-${{ github.sha }}
          path: server-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Scan resolved server runtime dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: rootfs
          scan-ref: server/build/install/server
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: "false"
          format: table
          exit-code: "1"
          timeout: 10m0s

      - name: Capture Medium server runtime findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: rootfs
          scan-ref: server/build/install/server
          scanners: vuln
          severity: MEDIUM
          ignore-unfixed: "false"
          format: json
          output: trivy-medium.json
          exit-code: "0"
          timeout: 10m0s

      - name: Reject new Medium server runtime findings
        run: bash scripts/verify-medium-vulnerability-baseline.sh trivy-medium.json

      - name: Scan final server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: jaiqal-server:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: "false"
          format: table
          exit-code: "1"
