name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_BIN: /usr/bin/google-chrome

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify API contracts
        run: ./gradlew --no-daemon :core:api-contract:allTests

      - name: Run server tests including PostgreSQL Testcontainers
        run: ./gradlew --no-daemon :server:test

      - name: Build server distribution
        run: ./gradlew --no-daemon :server:build -x test

      - name: Run Android lint
        run: ./gradlew --no-daemon :app:androidApp:lintDebug
