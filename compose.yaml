services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: jaiqal
      POSTGRES_USER: ${DATABASE_USER:-jaiqal}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-jaiqal-local-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
      DATABASE_URL: jdbc:postgresql://postgres:5432/jaiqal
      DATABASE_USER: ${DATABASE_USER:-jaiqal}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-jaiqal-local-password}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CHECK_REVOKED_TOKENS: ${FIREBASE_CHECK_REVOKED_TOKENS:-false}
      FIREBASE_AUTO_PROVISION_USERS: ${FIREBASE_AUTO_PROVISION_USERS:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    restart: unless-stopped

volumes:
  postgres-data:
